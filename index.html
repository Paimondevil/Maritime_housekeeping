<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maritime Inn Antigonish — Room Cleaning Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f7f5f0;
    --paper: #ffffff;
    --ink: #1c2b36;
    --navy: #16324f;
    --navy-dim: #3c5771;
    --gold: #b8873a;
    --gold-bg: #f3e6cf;
    --teal: #2f6e68;
    --teal-bg: #dcece9;
    --line: #dcd6c8;
    --line-strong: #b9b09a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wave{
    height:14px;
    width:100%;
    background:
      radial-gradient(circle at 10px -6px, transparent 12px, var(--navy) 12px) 0 0/28px 20px repeat-x;
  }
  header.top{
    background:var(--navy);
    color:#f7f5f0;
    padding:28px 24px 20px;
  }
  header.top .inner{
    max-width:980px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:12px;
  }
  header.top h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:28px;
    margin:0;
    letter-spacing:0.2px;
  }
  header.top .sub{
    font-size:13px;
    color:#c7d3dc;
    margin-top:4px;
    font-family:'IBM Plex Mono',monospace;
  }
  #dateLabel{font-weight:600;color:#fff;}
  main{max-width:980px;margin:0 auto;padding:24px;}
  .legend{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    align-items:center;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 18px;
    margin-bottom:24px;
    font-size:14px;
  }
  .legend .dot{width:14px;height:14px;border-radius:4px;display:inline-block;margin-right:8px;vertical-align:-2px;}
  .legend .hint{color:var(--navy-dim);font-size:13px;margin-left:auto;}
  .type-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 20px 20px;
    margin-bottom:18px;
  }
  .type-card h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17px;
    margin:0 0 14px;
    color:var(--navy);
  }
  .chip-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:15px;
    min-width:64px;
    padding:12px 10px;
    text-align:center;
    border-radius:8px;
    border:2px solid var(--line-strong);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
    user-select:none;
    transition:transform .08s ease, box-shadow .12s ease;
    position:relative;
  }
  .chip:active{transform:scale(0.96);}
  .chip .tag{
    display:block;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:10px;
    letter-spacing:0.04em;
    margin-top:3px;
    opacity:0.85;
  }
  .chip.full{background:var(--gold-bg);border-color:var(--gold);color:#5c3f10;}
  .chip.stay{background:var(--teal-bg);border-color:var(--teal);color:#173e3a;}
  .chip.priority{background:#3c1414;border-color:#7a1f1f;color:#fff;}
  .chip.priority .tag{opacity:1;color:#ffb3b3;}

  .actions{
    display:flex;
    gap:12px;
    justify-content:flex-end;
    margin:22px 0 40px;
    flex-wrap:wrap;
  }
  button.btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:12px 20px;
    border-radius:8px;
    border:none;
    cursor:pointer;
  }
  .btn.primary{background:var(--navy);color:#fff;}
  .btn.primary:hover{background:#0f2438;}
  .btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line-strong);}
  .btn.ghost:hover{background:#eee9dd;}

  /* ---- Print sheet view ---- */
  #sheetView{display:none;}
  .sheet{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:30px 32px;
  }
  .sheet-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1.5px solid var(--line-strong);
    padding-bottom:3px;
    margin-bottom:5px;
  }
  .sheet-head .name{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:15px;
    color:var(--navy);
  }
  .sheet-head .name span{
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:12px;
    color:var(--navy-dim);
  }
  .sheet-head .date{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--navy-dim);
    font-weight:600;
  }
  .block-title{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:12.5px;
    letter-spacing:0.02em;
    padding:3px 9px;
    border-radius:5px;
    margin:0 0 4px;
  }
  .block-title.stay{margin-top:7px;}
  .block-title.full{background:var(--gold-bg);color:#5c3f10;}
  .block-title.stay{background:var(--teal-bg);color:#173e3a;}
  table.roomtable{
    width:100%;
    border-collapse:collapse;
    margin-bottom:2px;
    table-layout:fixed;
  }
  table.roomtable th, table.roomtable td{
    border-right:1px solid var(--line);
  }
  table.roomtable th:last-child, table.roomtable td:last-child{
    border-right:none;
  }
  table.roomtable th{
    text-align:left;
    font-size:9px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.03em;
    color:var(--navy-dim);
    padding:3px 7px;
    border-bottom:1.5px solid var(--line-strong);
  }
  table.roomtable td{
    font-family:'IBM Plex Mono',monospace;
    font-size:15px;
    padding:3.5px 7px;
    border-bottom:1px solid var(--line);
    line-height:1.15;
  }
  table.roomtable tr{page-break-inside:avoid;}
  table.roomtable td.typecell{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    color:var(--navy-dim);
    vertical-align:top;
    padding-top:4.5px;
  }
  table.roomtable td.roomno{font-weight:700;color:var(--ink);}
  table.roomtable td.prioritycell{font-weight:700;color:#7a1f1f;text-align:center;}
  .blank-cell{color:transparent;}
  .empty-note{
    font-size:11px;
    color:var(--navy-dim);
    font-style:italic;
    padding:4px 4px 10px;
  }

  .notes-box{
    margin-top:6px;
    padding:4px 2px 5px;
  }
  .notes-box .label{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:9px;
    letter-spacing:0.03em;
    color:var(--navy-dim);
    margin-bottom:3px;
  }
  .notes-box .space{
    height:45px;
  }

  /* ---- Page 2: static daily task + break log, always prints on the back ---- */
  .page2{
    page-break-before: always;
    padding-top: 4px;
  }
  .page2 .block-title{margin-top:0;}
  .page2 .block-title.tasks{background:var(--gold-bg);color:#5c3f10;}
  .page2 .block-title.breaks{background:var(--teal-bg);color:#173e3a;margin-top:14px;}
  .page2 table.roomtable td{font-size:13px;}
  @page{ size: auto; margin: 4mm; }
  @media print{
    body{background:#fff;}
    .no-print{display:none !important;}
    #setupView{display:none !important;}
    #sheetView{display:block !important;}
    header.top{display:none !important;}
    .wave{display:none;}
    main{padding:0;max-width:100%;}
    .sheet{border:none;padding:0;}
    .sheet-head{font-size:14px;margin-bottom:8px;}
  }
  @media (max-width:560px){
    header.top h1{font-size:22px;}
    .chip{min-width:56px;padding:10px 6px;font-size:14px;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="inner">
    <div>
      <h1>Maritime Inn Antigonish</h1>
      <div class="sub">Housekeeping Room Cleaning Log</div>
    </div>
    <div class="sub">Tonight: <span id="dateLabel"></span></div>
  </div>
</header>
<div class="wave"></div>

<main>

  <div id="setupView">
    <div class="legend">
      <span><span class="dot" style="background:var(--gold);"></span>Tap once — Full Clean</span>
      <span><span class="dot" style="background:var(--teal);"></span>Tap twice — Stay Clean</span>
      <span><span class="dot" style="background:var(--paper);border:2px solid var(--line-strong);"></span>Tap again — Not assigned</span>
      <span class="hint">Tap a room number to cycle its status</span>
    </div>

    <div id="typeCards"></div>

    <div class="actions no-print">
      <button class="btn ghost" onclick="resetAll()">Reset all rooms</button>
      <button class="btn primary" onclick="goToPriority()">Generate sheet →</button>
    </div>
  </div>

  <div id="priorityView" style="display:none;">
    <div class="legend">
      <span><span class="dot" style="background:#3c1414;"></span>Tap a Full Clean room to mark it Priority</span>
      <span class="hint">Priority = booked for tomorrow, clean these first</span>
    </div>
    <div id="priorityCards"></div>
    <div class="actions no-print">
      <button class="btn ghost" onclick="backToSetup()">← Back</button>
      <button class="btn primary" onclick="showSheet()">Generate sheet →</button>
    </div>
  </div>

  <div id="sheetView" style="display:none;">
    <div class="sheet" id="sheetContent"></div>
    <div class="actions no-print" style="margin-top:20px;">
      <button class="btn ghost" onclick="backToSetup()">← Edit assignments</button>
      <button class="btn primary" onclick="window.print()">Print / Save as PDF</button>
    </div>
  </div>

</main>

<script>
  // Room roster — constant, grouped by room type as used on the printed log
  const ROOM_TYPES = [
    { name: "Select Queen",   rooms: [106,108,110,112,114,116,214,215,104] },
    { name: "Select King",    rooms: [103,105,107,109,111,113,115] },
    { name: "Select Double",  rooms: [201,202,203,204,205,206,207,208,209,210,211,212] },
    { name: "Premier King",   rooms: [216,217,218] },
    { name: "Executive Suite",rooms: [213] },
  ];

  // status: 0 = unassigned, 1 = Full Clean, 2 = Stay Clean
  const status = {};
  ROOM_TYPES.forEach(t => t.rooms.forEach(r => status[r] = 0));

  // priority: true = booked for tomorrow, clean first (Full Clean rooms only)
  const priority = {};
  ROOM_TYPES.forEach(t => t.rooms.forEach(r => priority[r] = false));

  const typeCardsEl = document.getElementById('typeCards');
  const priorityCardsEl = document.getElementById('priorityCards');

  function render(){
    typeCardsEl.innerHTML = '';
    ROOM_TYPES.forEach(type => {
      const card = document.createElement('div');
      card.className = 'type-card';
      const h2 = document.createElement('h2');
      h2.textContent = type.name;
      card.appendChild(h2);
      const grid = document.createElement('div');
      grid.className = 'chip-grid';
      type.rooms.forEach(room => {
        const chip = document.createElement('div');
        chip.className = 'chip' + (status[room]===1 ? ' full' : status[room]===2 ? ' stay' : '');
        chip.innerHTML = room + (status[room]===1 ? '<span class="tag">FULL</span>' : status[room]===2 ? '<span class="tag">STAY</span>' : '');
        chip.onclick = () => { status[room] = (status[room] + 1) % 3; render(); };
        grid.appendChild(chip);
      });
      card.appendChild(grid);
      typeCardsEl.appendChild(card);
    });
  }

  function resetAll(){
    ROOM_TYPES.forEach(t => t.rooms.forEach(r => { status[r] = 0; priority[r] = false; }));
    render();
  }

  function renderPriorityCards(){
    priorityCardsEl.innerHTML = '';
    ROOM_TYPES.forEach(type => {
      const fullRooms = type.rooms.filter(r => status[r] === 1);
      if(fullRooms.length === 0) return;
      const card = document.createElement('div');
      card.className = 'type-card';
      const h2 = document.createElement('h2');
      h2.textContent = type.name;
      card.appendChild(h2);
      const grid = document.createElement('div');
      grid.className = 'chip-grid';
      fullRooms.forEach(room => {
        const chip = document.createElement('div');
        chip.className = 'chip' + (priority[room] ? ' priority' : '');
        chip.innerHTML = room + (priority[room] ? '<span class="tag">PRIORITY</span>' : '');
        chip.onclick = () => { priority[room] = !priority[room]; renderPriorityCards(); };
        grid.appendChild(chip);
      });
      card.appendChild(grid);
      priorityCardsEl.appendChild(card);
    });
    if(!priorityCardsEl.children.length){
      priorityCardsEl.innerHTML = '<div class="empty-note">No Full Clean rooms assigned tonight — nothing to prioritize.</div>';
    }
  }

  function goToPriority(){
    const anyFull = ROOM_TYPES.some(t => t.rooms.some(r => status[r] === 1));
    if(!anyFull){
      showSheet();
      return;
    }
    renderPriorityCards();
    document.getElementById('setupView').style.display = 'none';
    document.getElementById('priorityView').style.display = 'block';
    window.scrollTo(0,0);
  }

  function buildBlock(label, code, cssClass, showPriority){
    // Collect matching rooms grouped by type, type shown once as a rowspan side-label
    const groups = ROOM_TYPES
      .map(type => ({ name: type.name, rooms: type.rooms.filter(r => status[r] === code) }))
      .filter(g => g.rooms.length > 0);

    let html = `<div class="block-title ${cssClass}">${label}</div>`;

    if(groups.length === 0){
      html += `<div class="empty-note">No rooms assigned to ${label.toLowerCase()} tonight.</div>`;
      return html;
    }

    if(showPriority){
      html += `<table class="roomtable"><thead><tr>
        <th style="width:10%;">Type</th><th style="width:5%;">P</th><th style="width:9%;">Room</th><th style="width:5%;">Gone</th><th style="width:27%;">Housekeeper</th><th style="width:10%;">Done</th><th style="width:12%;">Supervisor</th><th>Signature</th>
      </tr></thead><tbody>`;
    } else {
      html += `<table class="roomtable"><thead><tr>
        <th style="width:11%;">Type</th><th style="width:9%;">Room</th><th style="width:29%;">Housekeeper</th><th style="width:10%;">Done</th><th style="width:12%;">Supervisor</th><th>Signature</th>
      </tr></thead><tbody>`;
    }

    groups.forEach(g => {
      g.rooms.forEach((r, i) => {
        html += `<tr>`;
        if(i === 0){
          html += `<td class="typecell" rowspan="${g.rooms.length}">${g.name}</td>`;
        }
        if(showPriority){
          html += `<td class="prioritycell">${priority[r] ? 'P' : ''}</td>`;
        }
        html += `
          <td class="roomno">${r}</td>`;
        if(showPriority){
          html += `<td class="blank-cell">&nbsp;</td>`;
        }
        html += `
          <td class="blank-cell">&nbsp;</td>
          <td class="blank-cell">&nbsp;</td>
          <td class="blank-cell">&nbsp;</td>
          <td class="blank-cell">&nbsp;</td>
        </tr>`;
      });
    });

    html += `</tbody></table>`;
    return html;
  }

  function buildPage2(){
    const tasks = [
      "Men's Washroom",
      "Women's Washroom",
      "Employee Washroom",
      "Downstairs Lobby — Vacuum",
      "Downstairs Lobby — Mop",
      "Upstairs — Vacuum",
      "Laundry",
      "Linen Room — Organized",
      "Celtic Room",
    ];
    let html = `<div class="page2">`;
    html += `<div class="block-title tasks">Daily Housekeeping Task Log</div>`;
    html += `<table class="roomtable">
      <colgroup>
        <col style="width:20%;">
        <col style="width:8%;"><col style="width:8%;"><col style="width:8%;"><col style="width:8%;">
        <col style="width:8%;"><col style="width:8%;"><col style="width:8%;"><col style="width:8%;">
        <col style="width:16%;">
      </colgroup>
      <thead>
        <tr>
          <th rowspan="2">Task</th>
          <th colspan="4">Completed</th>
          <th colspan="4">Employee Name</th>
          <th rowspan="2">Supervisor Initial</th>
        </tr>
        <tr>
          <th>9AM</th><th>11AM</th><th>1PM</th><th>3PM</th>
          <th>9AM</th><th>11AM</th><th>1PM</th><th>3PM</th>
        </tr>
      </thead>
      <tbody>`;
    tasks.forEach(t => {
      const isWashroom = t.includes('Washroom');
      html += `<tr><td>${t}</td>`;
      if(isWashroom){
        html += `<td class="blank-cell">&nbsp;</td><td class="blank-cell">&nbsp;</td><td class="blank-cell">&nbsp;</td><td class="blank-cell">&nbsp;</td>`;
        html += `<td class="blank-cell">&nbsp;</td><td class="blank-cell">&nbsp;</td><td class="blank-cell">&nbsp;</td><td class="blank-cell">&nbsp;</td>`;
      } else {
        html += `<td class="blank-cell" colspan="4">&nbsp;</td>`;
        html += `<td class="blank-cell" colspan="4">&nbsp;</td>`;
      }
      html += `<td class="blank-cell">&nbsp;</td></tr>`;
    });
    html += `</tbody></table>`;

    html += `<div class="block-title breaks">Employee Break Log</div>`;
    html += `<table class="roomtable"><thead><tr>
      <th style="width:30%;">Employee Name</th><th style="width:20%;">Break Start</th><th style="width:20%;">Break End</th><th>Signature</th>
    </tr></thead><tbody>`;
    for(let i = 0; i < 8; i++){
      html += `<tr>
        <td class="blank-cell">&nbsp;</td>
        <td class="blank-cell">&nbsp;</td>
        <td class="blank-cell">&nbsp;</td>
        <td class="blank-cell">&nbsp;</td>
      </tr>`;
    }
    html += `</tbody></table>`;
    html += `<div class="notes-box">
      <div class="label">*NOTES</div>
      <div class="space"></div>
    </div>`;
    html += `</div>`;
    return html;
  }

  function showSheet(){
    const today = new Date().toLocaleDateString('en-CA', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
    let html = `<div class="sheet-head">
      <div class="name">Maritime Inn Antigonish: <span>Housekeeping List</span></div>
      <div class="date">${today}</div>
    </div>`;
    html += buildBlock('Full Clean', 1, 'full', true);
    html += buildBlock('Stay Clean', 2, 'stay', false);
    html += `<div class="notes-box">
      <div class="label">*KEYS</div>
      <div class="space"></div>
    </div>`;
    html += buildPage2();
    document.getElementById('sheetContent').innerHTML = html;
    document.getElementById('setupView').style.display = 'none';
    document.getElementById('priorityView').style.display = 'none';
    document.getElementById('sheetView').style.display = 'block';
    window.scrollTo(0,0);
  }

  function backToSetup(){
    document.getElementById('sheetView').style.display = 'none';
    document.getElementById('priorityView').style.display = 'none';
    document.getElementById('setupView').style.display = 'block';
  }

  document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('en-CA', { weekday:'long', month:'long', day:'numeric' });
  render();
</script>

</body>
</html>
